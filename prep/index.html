<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Prep Simplifier</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00e676;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .description {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .section-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #070a0e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 12px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .output-box {
            margin-top: 30px;
            background: #070a0e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            display: none;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            color: var(--accent-color);
            display: none;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Professor-Specific Exam Prep Simplifier</h1>
    <p class="description">Paste lecture materials, syllabus modules, or reading notes below to instantly simulate realistic exam parameters.</p>
    
    <label class="section-label" for="sourceMaterial">Step 1: Paste Source Material / Textbook Excerpts</label>
    <textarea id="sourceMaterial" placeholder="Paste your study texts or lecture content notes here..."></textarea>
    
    <button id="generateBtn" class="btn" onclick="processMaterialRequest()">Generate Mock Exam Study Guide</button>
    
    <div id="loadingIndicator" class="loading">Analyzing resource documents and compiling structured exam matrix...</div>
    
    <div id="outputDisplay" class="output-box"></div>
</div>

<script>
    // --- GATEWAY CONFIGURATION ---
    // Note: Storing raw keys in frontend files exposes them on public repos. 
    // Use a lightweight reverse proxy or cloudflare worker to route this securely in production.
    const API_ENDPOINT = "https://openai.com"; 
    const API_KEY = "YOUR_API_KEY_HERE"; 
    const TARGET_MODEL = "gpt-4o-mini"; // Switch seamlessly to "gpt-4o" or Claude endpoints later

    async function processMaterialRequest() {
        const materialInput = document.getElementById("sourceMaterial").value.trim();
        const generateBtn = document.getElementById("generateBtn");
        const loadingIndicator = document.getElementById("loadingIndicator");
        const outputDisplay = document.getElementById("outputDisplay");

        if (!materialInput) {
            alert("Please paste your source material or lecture notes to proceed.");
            return;
        }

        // Adjust UI state
        generateBtn.disabled = true;
        loadingIndicator.style.display = "block";
        outputDisplay.style.display = "none";
        outputDisplay.innerHTML = "";

        // Construct a structured ground-truth prompt for the engine
        const systemInstruction = "You are an elite, strict college university professor. Analyze the provided study materials thoroughly. Generate a mock exam consisting of 5 highly challenging multiple-choice questions and 2 short-answer questions. Every question must be directly grounded in the text provided. Do not use external assumptions or outside facts. Provide an answer key at the very bottom.";

        try {
            const response = await fetch(API_ENDPOINT, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: TARGET_MODEL,
                    messages: [
                        { role: "system", content: systemInstruction },
                        { role: "user", content: `Here is the course material to build the exam from:\n\n${materialInput}` }
                    ],
                    temperature: 0.3 // Kept low to enforce accuracy and prevent hallucinations
                })
            });

            if (!response.ok) {
                throw new Error(`API Error: ${response.status} Status Returned`);
            }

            const data = await response.json();
            const examOutput = data.choices[0].message.content;

            // Render results
            outputDisplay.innerText = examOutput;
            outputDisplay.style.display = "block";

        } catch (error) {
            console.error(error);
            alert("An issue occurred while connecting to the computational processing endpoint. Check configuration settings.");
        } finally {
            // Restore UI state
            generateBtn.disabled = false;
            loadingIndicator.style.display = "none";
        }
    }
</script>

</body>
</html>
