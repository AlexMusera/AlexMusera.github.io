<!DOCTYPE html>
<html>
<head>
    <title>Verifying Invoice Session...</title>
    <script>
        // 1. Grabs the long encrypted string directly from the hash parameter after the '#' symbol
        const secureToken = window.location.hash.substring(1);

        if (secureToken) {
            // 2. Instantly redirects the client straight to your main layout frame page
            window.location.href = "index.html?id=" + secureToken;
        } else {
            // Fallback to main page if someone opens the link without a hash
            window.location.href = "index.html";
        }
    </script>
</head>
<body style="background-color: #f3f4f6;">
</body>
</html>
