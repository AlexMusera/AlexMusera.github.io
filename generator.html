<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Split-Link Generator</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; max-width: 480px; margin: 60px auto; padding: 20px; background: #f3f4f6;">

    <div style="background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e5e7eb;">
        <h3 style="margin-top: 0; color: #111827; font-size: 18px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; margin-bottom: 20px;">
            🔒 Safe Split-Link Generator
        </h3>
        
        <!-- Book Title Input Field -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Book Title & Edition:</label>
            <input type="text" id="book-title-field" placeholder="e.g., wazua makosa" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px;">
        </div>
        
        <!-- Book Price Input Field -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Negotiated Price ($):</label>
            <input type="text" id="book-price-field" placeholder="45" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px;">
        </div>
        
        <!-- Sample File Asset Link Slot -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">15-Page Sample Link/ID (Fast Loader):</label>
            <input type="text" id="book-preview-field" placeholder="Paste sample file link or ID" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; font-family: monospace;">
        </div>

        <!-- Full Heavy Asset Link Slot -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Full Book Link/ID (Post-Payment Asset):</label>
            <input type="text" id="book-download-field" placeholder="Paste full book file link or ID" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; font-family: monospace;">
        </div>
        
        <!-- Processing Trigger Button -->
        <button onclick="generateSplitUrl()" style="width: 100%; padding: 12px; background: #059669; color: white; border: none; font-weight: bold; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background 0.15s;">
            Build Client Link
        </button>
        
        <!-- Short Token Output Console Box Area -->
        <div id="output-box" style="display: none; margin-top: 25px; padding-top: 20px; border-top: 2px solid #f3f4f6;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #059669; text-transform: uppercase; margin-bottom: 6px;">Your Short Encrypted Link:</label>
            <textarea id="output-url-string" readonly style="width: 100%; height: 65px; padding: 10px; background: #f9fafb; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 12px; margin-bottom: 10px; resize: none;"></textarea>
            <button id="copy-btn" onclick="copyToClipboard()" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; font-weight: bold; border-radius: 6px; font-size: 14px; cursor: pointer;">📋 Copy Short Link</button>
        </div>
    </div>

    <script>
        function extractDriveId(str) {
            var match = str.trim().match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : str.trim();
        }

        function generateSplitUrl() {
            var title = document.getElementById('book-title-field').value.trim();
            var price = document.getElementById('book-price-field').value.trim();
            var rawPreview = document.getElementById('book-preview-field').value;
            var rawDownload = document.getElementById('book-download-field').value;
            
            if (!price || !rawPreview || !rawDownload) {
                alert("Please provide the price, sample ID, and full book ID.");
                return;
            }
            
            var cleanPreviewId = extractDriveId(rawPreview);
            var cleanDownloadId = extractDriveId(rawDownload);
            var cleanTitle = title || "Preview";
            
            // Packs the fast sample file as 'p' and the separate full book asset as 'd' inside the payload token
            var internalPayload = "p=" + encodeURIComponent(cleanPreviewId) + 
                                  "&d=" + encodeURIComponent(cleanDownloadId) + 
                                  "&pr=" + encodeURIComponent(price) + 
                                  "&t=" + encodeURIComponent(cleanTitle);
            
            // Compresses all parameters out of sight into a single text hash
            var encryptedToken = btoa(internalPayload);
            
            // Your exact live production repository domain path
            var baseDomain = "https://alexmusera.github.io";
            var finalUrl = baseDomain + "?id=" + encryptedToken;
            
            document.getElementById('output-url-string').value = finalUrl;
            document.getElementById('output-box').style.display = 'block';
            
            var btn = document.getElementById('copy-btn');
            btn.style.background = "#2563eb";
            btn.innerText = "📋 Copy Short Link";
        }

        function copyToClipboard() {
            var txt = document.getElementById('output-url-string');
            txt.select();
            navigator.clipboard.writeText(txt.value).then(function() {
                var btn = document.getElementById('copy-btn');
                btn.style.background = "#059669";
                btn.innerText = "✓ Copied Short Link!";
            });
        }
    </script>
</body>
</html>
