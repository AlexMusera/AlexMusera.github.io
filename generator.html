<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Link Generator</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; max-width: 520px; margin: 40px auto; padding: 20px; background: #f3f4f6;">

    <div style="background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e5e7eb;">
        <h3 style="margin-top: 0; color: #111827; font-size: 18px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; margin-bottom: 20px;">
            🚀 Portal Link Generator
        </h3>
        
        <!-- Book Title Input -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Book Title & Edition:</label>
            <input type="text" id="book-title-field" placeholder="e.g., Psychology 3rd Edition" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px;">
        </div>
        
        <!-- Negotiated Price Input -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Negotiated Price ($):</label>
            <input type="text" id="book-price-field" placeholder="e.g., 19.00" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px;">
        </div>
        
        <!-- Google Drive Preview ID -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Google Drive Preview ID:</label>
            <input type="text" id="book-id-field" placeholder="e.g., 1HHcCMSb-64vQ_XqvmJ2xnXYdF7iBR7mS" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; font-family: monospace;">
        </div>

        <!-- Google Drive Full Download URL -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Actual File Download Link:</label>
            <input type="text" id="book-download-field" placeholder="https://google.com" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px;">
        </div>
        
        <button onclick="generateSecureUrl()" style="width: 100%; padding: 12px; background: #059669; color: white; border: none; font-weight: bold; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background 0.15s;">
            Build Client Link
        </button>
        
        <!-- Output Terminal Window -->
        <div id="output-box" style="display: none; margin-top: 25px; padding-top: 20px; border-top: 2px solid #f3f4f6;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #059669; text-transform: uppercase; margin-bottom: 6px;">Generated URL:</label>
            <textarea id="output-url-string" readonly style="width: 100%; height: 75px; padding: 10px; background: #f9fafb; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 12px; color: #1e293b; resize: none; margin-bottom: 10px;"></textarea>
            
            <button id="copy-btn" onclick="copyLinkToClipboard()" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; font-weight: bold; border-radius: 6px; font-size: 14px; cursor: pointer; transition: background 0.2s;">
                📋 Copy Link to Clipboard
            </button>
        </div>
    </div>

    <script>
        function generateSecureUrl() {
            var titleInput = document.getElementById('book-title-field').value.trim();
            var priceInput = document.getElementById('book-price-field').value.trim();
            var idInput = document.getElementById('book-id-field').value.trim();
            var downloadInput = document.getElementById('book-download-field').value.trim();
            
            if (!priceInput || !idInput || !downloadInput) {
                alert("Please provide Price, Drive File ID, and the Download Link.");
                return;
            }
            
            var cleanTitle = encodeURIComponent(titleInput || "Your Requested Document");
            var cleanPrice = encodeURIComponent(priceInput);
            var cleanId = encodeURIComponent(idInput);
            var cleanDownload = encodeURIComponent(downloadInput);
            
            var baseDomain = "https://github.io";
            
            // Constructs url using all properties checked by your production file script
            var finalUrl = baseDomain + "?price=" + cleanPrice + "&title=" + cleanTitle + "&preview=" + cleanId + "&download=" + cleanDownload;
            
            document.getElementById('output-url-string').value = finalUrl;
            document.getElementById('output-box').style.display = 'block';
            
            // Reset copy button styling when a brand new link is built
            var copyBtn = document.getElementById('copy-btn');
            copyBtn.style.background = "#2563eb";
            copyBtn.innerText = "📋 Copy Link to Clipboard";
        }

        function copyLinkToClipboard() {
            var textArea = document.getElementById('output-url-string');
            textArea.select();
            textArea.setSelectionRange(0, 99999); // Safe selector range limit for mobile web layers
            
            navigator.clipboard.writeText(textArea.value).then(function() {
                var copyBtn = document.getElementById('copy-btn');
                copyBtn.style.background = "#059669"; // Turns emerald green when verified copied
                copyBtn.innerText = "✓ Link Copied Perfectly!";
            }).catch(function(err) {
                alert("Failed to copy link automatically. Please select the string manually.");
            });
        }
    </script>
</body>
</html>
