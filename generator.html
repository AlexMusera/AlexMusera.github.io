<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Short Link Generator</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; max-width: 480px; margin: 60px auto; padding: 20px; background: #f3f4f6;">

    <div style="background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e5e7eb;">
        <h3 style="margin-top: 0; color: #111827; font-size: 18px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; margin-bottom: 20px;">
            🚀 Ultra-Short Link Generator
        </h3>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Book Title:</label>
            <input type="text" id="book-title-field" placeholder="e.g., wazua makosa" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Price ($):</label>
            <input type="text" id="book-price-field" placeholder="20" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 6px;">Google Drive Link or ID:</label>
            <input type="text" id="book-id-field" placeholder="Paste link here" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; font-family: monospace;">
        </div>
        
        <button onclick="generateShortUrl()" style="width: 100%; padding: 12px; background: #059669; color: white; border: none; font-weight: bold; border-radius: 6px; font-size: 15px; cursor: pointer;">
            Build Compact Link
        </button>
        
        <div id="output-box" style="display: none; margin-top: 25px; padding-top: 20px; border-top: 2px solid #f3f4f6;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: #059669; text-transform: uppercase; margin-bottom: 6px;">Short URL:</label>
            <textarea id="output-url-string" readonly style="width: 100%; height: 65px; padding: 10px; background: #f9fafb; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 12px; margin-bottom: 10px; resize: none;"></textarea>
            <button id="copy-btn" onclick="copyToClipboard()" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; font-weight: bold; border-radius: 6px; font-size: 14px; cursor: pointer;">📋 Copy Link</button>
        </div>
    </div>

    <script>
        function extractDriveId(str) {
            var match = str.trim().match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : str.trim();
        }

        function generateShortUrl() {
            var title = document.getElementById('book-title-field').value.trim();
            var price = document.getElementById('book-price-field').value.trim();
            var rawId = document.getElementById('book-id-field').value;
            
            if (!price || !rawId) {
                alert("Please fill in price and document ID.");
                return;
            }
            
            var cleanId = extractDriveId(rawId);
            var cleanTitle = encodeURIComponent(title || "Preview");
            
            // FIXED: Your exact live production URL path
            var baseDomain = "https://alexmusera.github.io/";
            
            // Outputs the clean, real live production URL
            var finalUrl = baseDomain + "?price=" + encodeURIComponent(price) + "&title=" + cleanTitle + "&preview=" + encodeURIComponent(cleanId);
            
            document.getElementById('output-url-string').value = finalUrl;
            document.getElementById('output-box').style.display = 'block';
            
            var btn = document.getElementById('copy-btn');
            btn.style.background = "#2563eb";
            btn.innerText = "📋 Copy Link";
        }

        function copyToClipboard() {
            var txt = document.getElementById('output-url-string');
            txt.select();
            navigator.clipboard.writeText(txt.value).then(function() {
                var btn = document.getElementById('copy-btn');
                btn.style.background = "#059669";
                btn.innerText = "✓ Copied Short Link!";
            });
        }
    </script>
</body>
</html>
