<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dynamic Title updated by JavaScript -->
    <title id="page-window-title">Secure Preview Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #11111b;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .portal-container {
            width: 100%;
            max-width: 680px;
            background: #1e1e2e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #313244;
            overflow: hidden;
        }

        .portal-header {
            background: #181825;
            padding: 20px 24px;
            border-bottom: 1px solid #313244;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .book-title-text {
            font-size: 18px;
            font-weight: 600;
            color: #a6e3a1;
            margin: 0;
        }

        .session-badge {
            font-size: 11px;
            font-weight: 700;
            color: #f38ba8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(243, 139, 168, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            width: max-content;
        }

        .timer-display {
            font-family: monospace;
            font-size: 14px;
            color: #bac2de;
            background: #11111b;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #313244;
        }

        .viewer-viewport {
            background: #11111b;
            height: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .document-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .status-heading {
            font-size: 20px;
            font-weight: 600;
            color: #cdd6f4;
            margin: 0 0 8px 0;
        }

        .status-subtext {
            font-size: 14px;
            color: #a6adc8;
            max-width: 400px;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #89b4fa;
            color: #11111b;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.15s ease;
        }

        .action-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <!-- Professional Header Row -->
        <div class="portal-header">
            <div class="book-meta">
                <span class="session-badge">Verification Session Active</span>
                <!-- The Title text injection point -->
                <h2 id="dynamic-book-title" class="book-title-text">Loading Document Details...</h2>
            </div>
            <div id="countdown-timer" class="timer-display">Time Remaining: --:--</div>
        </div>

        <!-- Custom Polished Viewport (Replaces the broken Google embed style) -->
        <div class="viewer-viewport">
            <div class="document-icon">📄</div>
            <h3 class="status-heading">Document Stream Ready</h3>
            <p class="status-subtext">This comprehensive edition is optimized for standalone reading. Access the safe download stream via the link below.</p>
            <a id="direct-download-action" href="#" target="_blank" class="action-button">
                📥 Open File Stream Context
            </a>
        </div>
    </div>

    <script>
        // Helper to cleanly extract verification params from your incoming Base64 link token
        function parseQueryToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('id');
            if (!token) return null;

            try {
                const decodedString = atob(token);
                const params = new URLSearchParams(decodedString);
                return {
                    previewId: params.get('p'),
                    downloadId: params.get('d'),
                    price: params.get('pr'),
                    title: decodeURIComponent(params.get('t') || 'Standard Asset Reference')
                };
            } catch (e) {
                console.error("Token decoding fault:", e);
                return null;
            }
        }

        // Initialize portal layout context
        window.addEventListener('DOMContentLoaded', () => {
            const assetData = parseQueryToken();
            
            if (assetData) {
                // Update elements dynamically with real names
                document.getElementById('dynamic-book-title').innerText = assetData.title;
                document.getElementById('page-window-title').innerText = "Preview: " + assetData.title;
                
                // Route the file download target cleanly
                const finalDownloadUrl = "https://drive.google.com" + assetData.previewId;
                document.getElementById('direct-download-action').href = finalDownloadUrl;
                
                // Initialize the countdown display sequence
                startPortalTimer(59);
            } else {
                document.getElementById('dynamic-book-title').innerText = "Error: Invalid Access Session";
                document.getElementById('dynamic-book-title').style.color = "#f38ba8";
            }
        });

        function startPortalTimer(durationSeconds) {
            let timeRemaining = durationSeconds;
            const display = document.getElementById('countdown-timer');
            
            const timerInterval = setInterval(() => {
                let minutes = Math.floor(timeRemaining / 60);
                let seconds = timeRemaining % 60;

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = "Time Remaining: " + minutes + ":" + seconds;

                if (--timeRemaining < 0) {
                    clearInterval(timerInterval);
                    display.innerText = "Session Completed";
                    display.style.color = "#f38ba8";
                }
            }, 1000);
        }
    </script>
</body>
</html>
