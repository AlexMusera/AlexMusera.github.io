<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-window-title">Secure Preview Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #11111b;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
        }

        .portal-container {
            width: 100%;
            max-width: 680px;
            background: #1e1e2e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #313244;
            overflow: hidden;
        }

        .portal-header {
            background: #181825;
            padding: 20px 24px;
            border-bottom: 1px solid #313244;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .book-title-text {
            font-size: 18px;
            font-weight: 600;
            color: #a6e3a1;
            margin: 0;
        }

        .session-badge {
            font-size: 11px;
            font-weight: 700;
            color: #f38ba8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(243, 139, 168, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            width: max-content;
        }

        .timer-display {
            font-family: monospace;
            font-size: 14px;
            color: #bac2de;
            background: #11111b;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #313244;
        }

        .viewer-viewport {
            background: #11111b;
            height: 580px;
            padding: 0;
            position: relative;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #11111b;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <!-- Premium Dark Mode Header Row -->
        <div class="portal-header">
            <div class="book-meta">
                <span class="session-badge">Verification Session Active</span>
                <!-- The Title text injection point -->
                <h2 id="dynamic-book-title" class="book-title-text">Loading Document Details...</h2>
            </div>
            <div id="countdown-timer" class="timer-display">Time Remaining: --:--</div>
        </div>

        <!-- Embedded Document Frame Viewport (Brought cleanly inside your main page template layout) -->
        <div class="viewer-viewport">
            <iframe id="inline-document-frame" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        // Helper to cleanly extract verification params from your incoming Base64 link token
        function parseQueryToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('id');
            if (!token) return null;

            try {
                const decodedString = atob(token);
                const params = new URLSearchParams(decodedString);
                return {
                    previewId: params.get('p'),
                    downloadId: params.get('d'),
                    price: params.get('pr'),
                    title: decodeURIComponent(params.get('t') || 'Standard Asset Reference')
                };
            } catch (e) {
                console.error("Token decoding fault:", e);
                return null;
            }
        }

        // Initialize portal layout context
        window.addEventListener('DOMContentLoaded', () => {
            const assetData = parseQueryToken();
            
            if (assetData) {
                // Update elements dynamically with decrypted book metadata parameter names
                document.getElementById('dynamic-book-title').innerText = assetData.title;
                document.getElementById('page-window-title').innerText = "Preview: " + assetData.title;
                
                // FIXED: Integrated the high-performance document rendering path with drive variables included
            //    const finalViewerUrl = "https://drive.google.com/"+ assetData.previewId  + "&embedded=true";

                const finalViewerUrl = "https://drive.google.com/" + assetData.previewId + "&embedded=true";

                document.getElementById('inline-document-frame').src = finalViewerUrl;
                
                // Initialize the countdown display sequence
                startPortalTimer(59);
            } else {
                document.getElementById('dynamic-book-title').innerText = "Error: Invalid Access Session";
                document.getElementById('dynamic-book-title').style.color = "#f38ba8";
            }
        });

        function startPortalTimer(durationSeconds) {
            let timeRemaining = durationSeconds;
            const display = document.getElementById('countdown-timer');
            
            const timerInterval = setInterval(() => {
                let minutes = Math.floor(timeRemaining / 60);
                let seconds = timeRemaining % 60;

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = "Time Remaining: " + minutes + ":" + seconds;

                if (--timeRemaining < 0) {
                    clearInterval(timerInterval);
                    display.innerText = "Session Completed";
                    display.style.color = "#f38ba8";
                }
            }, 1000);
        }
    </script>
</body>
</html>
